{% extends "layout.html" %}

{% block title %}{{ post.title }} - 简易博客{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card mb-4">
            <div class="card-body">
                <h1 class="card-title">{{ post.title }}</h1>
                <p class="card-text text-muted">
                    <small>作者: {{ post.author }} | 发布时间: {{ post.date }}</small>
                </p>
                <div class="card-text post-content">
                    {{ post.content | replace('\n', '<br>') | safe }}
                </div>
                
                <div class="mt-4">
                    <a href="{{ url_for('index') }}" class="btn btn-primary">返回首页</a>
                    
                    {% if session.username == post.author %}
                    <a href="{{ url_for('edit_post', post_id=post.id) }}" class="btn btn-secondary">编辑</a>
                    <a href="{{ url_for('delete_post', post_id=post.id) }}" class="btn btn-danger" onclick="return confirm('确定要删除这篇文章吗？');">删除</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
